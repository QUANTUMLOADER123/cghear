name: android-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Build APK (aapt2 + d8 + ndk-build, no Gradle)
        run: |
          # resolve NDK: setup-ndk output (either key), else preinstalled SDK copy
          ANDROID_NDK=""
          for d in "${{ steps.ndk.outputs.ndk-root }}" "${{ steps.ndk.outputs.path }}" \
                   $ANDROID_HOME/ndk/*/ ; do
              if [ -n "$d" ] && [ -f "$d/ndk-build" ]; then
                  ANDROID_NDK="$(realpath "$d")"; break
              fi
          done
          [ -n "$ANDROID_NDK" ] || { echo "::error::no Android NDK found"; exit 1; }
          echo "Using NDK: $ANDROID_NDK"
          export ANDROID_NDK
          bash android/build_apk.sh > build.log 2>&1 || { tail -60 build.log; exit 1; }
          tail -20 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Headless logic test
        run: bash tests/run_headless.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hyperstack-apk
          path: build-android/hyperstack.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-android/hyperstack.apk
